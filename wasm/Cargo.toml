[workspace]
members = ["rule_engine_core", "rule_engine_wasm", "rule_engine_dsim_wasm", "sfc_engine"]
exclude = ["rule_engine"]
resolver = "2"

# Every crate in the workspace ships as part of the app, so they all carry the app's
# version rather than a private one — a consumer reading `sfc_version()` off a prebuilt
# DLL learns which app build produced it. This field is the ONE place the Rust side
# spells that version; members inherit it with `version.workspace = true`.
# It mirrors `version` in the repo-root package.json, which stays the single source of
# truth: the release script rewrites both together (see scripts/release/release-win.ps1),
# so never hand-edit this to a value package.json does not have.
[workspace.package]
# The project license (see LICENSE); members inherit it with `license.workspace = true`.
license = "AGPL-3.0-or-later"
version = "1.0.49-dev"
