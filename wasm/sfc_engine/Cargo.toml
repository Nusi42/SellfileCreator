[package]
name    = "sfc_engine"
version.workspace = true
edition = "2021"

[lib]
# cdylib produces the shipped native library (sfc_engine.dll / .so / .dylib), which an
# external program loads to get keep/sell decisions over the C ABI.
# rlib additionally lets the integration tests link the crate as a normal library.
# No wasm-bindgen dependency — JSON strings pass over the C ABI.
crate-type = ["cdylib", "rlib"]

[dependencies]
rule_engine_core = { path = "../rule_engine_core" }
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
