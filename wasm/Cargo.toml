[workspace]
members = ["rule_engine_core", "rule_engine_wasm", "rule_engine_dsim_wasm", "rule_engine_native"]
exclude = ["rule_engine"]
resolver = "2"

# TALC-PATCH: use the vendored copy of talc so we can apply our correctness patches.
# Fixes a talc 5.0.3 bug where the tag byte overlaps the end-size MSB, causing is_allocated()
# to misidentify free gaps ≥16 MiB as allocated chunks, ultimately corrupting the free list.
#
# Root cause: upstream tag_byte(addr) = addr[-1] is the MSB of the 4-byte LE end-size word.
# For gaps in [16 MiB, 32 MiB) that MSB has ALLOCATED_FLAG set from the size value itself.
# deallocate misreads the gap as allocated, calls set_above_free on the end-size MSB (corrupts
# it), and clear_above_free (XOR) then flips ABOVE_FREE 0→1 → next dealloc reads garbage → OOB.
#
# Changes in vendor/talc vs upstream (grep TALC-PATCH):
#   - Architectural layout fix (chunk.rs): GAP_HIGH_SIZE_OFFSET 4→8, CHUNK_UNIT 16→32 (wasm32).
#     end-size word is now at end[-8..end-4]; tag byte stays at end[-1] but is now separate
#     padding — never the end-size MSB.  register_gap writes Tag(0) at end[-1] so is_allocated()
#     returns false for ANY gap size.  set_above_free can no longer corrupt end-size.
#     This makes the is_allocated()/ABOVE_FREE corruption chain ARCHITECTURALLY IMPOSSIBLE.
#   - clear_above_free: AND-NOT instead of XOR (tag.rs) — idempotent spurious clears are safe
#   - talc_gap_looks_valid(): simplified size cross-check (mod.rs) — CHUNK_UNIT trivial-match
#     exception and Node structural check no longer needed; size fields at distinct addresses
#   - Non-panicking set_above_free / clear_above_free: removed debug_assert (tag.rs) to prevent
#     recursive-panic when the panic handler itself allocates
[patch.crates-io]
talc = { path = "vendor/talc" }
