<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 200" width="960" height="200" role="img" aria-labelledby="title desc">
  <title id="title">Sellfile Creator</title>
  <desc id="desc">Build, preview and export sell files for RSL Helper.</desc>
  <style>
    .bg { fill: #0f1a2b; }
    .frame { fill: none; stroke: #b8954a; stroke-width: 1.5; }
    .inner { fill: none; stroke: #e7c77a; stroke-opacity: .35; stroke-width: 1; }
    .title { font: 700 54px "Segoe UI", system-ui, sans-serif; fill: #f2e3b8; letter-spacing: .5px; }
    .sub { font: 400 20px "Segoe UI", system-ui, sans-serif; fill: #9fb4cc; }
    .gem { fill: #e7c77a; }
    .row { fill: #1c2b42; }
    .keep { fill: #3fa66b; }
    .sell { fill: #d0573f; }
    .shine { fill: url(#shine); mix-blend-mode: screen; }
    .row1 { animation: verdict 6s ease-in-out infinite; }
    .row2 { animation: verdict 6s ease-in-out infinite .6s; }
    .row3 { animation: verdict 6s ease-in-out infinite 1.2s; }
    .row4 { animation: verdict 6s ease-in-out infinite 1.8s; }
    .sweep { animation: sweep 6s ease-in-out infinite; }
    @keyframes verdict { 0%, 18% { opacity: .15 } 30%, 82% { opacity: 1 } 100% { opacity: .15 } }
    @keyframes sweep { 0% { transform: translateX(-260px) } 55%, 100% { transform: translateX(980px) } }
    @media (prefers-reduced-motion: reduce) {
      .row1, .row2, .row3, .row4 { animation: none; opacity: 1; }
      .sweep { animation: none; display: none; }
    }
  </style>
  <defs>
    <linearGradient id="shine" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect x="0" y="0" width="960" height="200" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect class="bg" width="960" height="200"/>
    <rect class="frame" x="8" y="8" width="944" height="184" rx="10"/>
    <rect class="inner" x="13" y="13" width="934" height="174" rx="7"/>
    <!-- Corner brackets, as on the app's panels. -->
    <path class="frame" d="M8 40 V8 H40 M920 8 H952 V40 M952 160 V192 H920 M40 192 H8 V160"/>
    <path class="gem" d="M52 72 l8 -8 l8 8 l-8 8 Z"/>
    <text class="title" x="80" y="92">Sellfile Creator</text>
    <text class="sub" x="82" y="128">Build, preview and export sell files for RSL Helper</text>
    <!-- A small rule list: each piece of gear gets its verdict. -->
    <g transform="translate(640 46)">
      <g class="row1"><rect class="row" width="260" height="22" rx="4"/><rect class="keep" x="8" y="6" width="34" height="10" rx="3"/><rect x="52" y="8" width="150" height="6" rx="3" fill="#9fb4cc" fill-opacity=".5"/></g>
      <g class="row2" transform="translate(0 28)"><rect class="row" width="260" height="22" rx="4"/><rect class="sell" x="8" y="6" width="34" height="10" rx="3"/><rect x="52" y="8" width="120" height="6" rx="3" fill="#9fb4cc" fill-opacity=".5"/></g>
      <g class="row3" transform="translate(0 56)"><rect class="row" width="260" height="22" rx="4"/><rect class="keep" x="8" y="6" width="34" height="10" rx="3"/><rect x="52" y="8" width="170" height="6" rx="3" fill="#9fb4cc" fill-opacity=".5"/></g>
      <g class="row4" transform="translate(0 84)"><rect class="row" width="260" height="22" rx="4"/><rect class="sell" x="8" y="6" width="34" height="10" rx="3"/><rect x="52" y="8" width="100" height="6" rx="3" fill="#9fb4cc" fill-opacity=".5"/></g>
    </g>
    <rect class="shine sweep" x="0" y="0" width="220" height="200"/>
  </g>
</svg>
