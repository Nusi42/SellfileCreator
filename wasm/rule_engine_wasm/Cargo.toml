[package]
name = "rule_engine_wasm"
version.workspace = true
license.workspace = true
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
rule_engine_core = { path = "../rule_engine_core" }
serde = { version = "1.0", features = ["derive"] }
# ts-rs derives `#[derive(TS)]` for wire types declared locally in this crate
# (e.g. ImprovementChanceOutput and the JSON-string input wrappers).  Same
# rationale as in rule_engine_core: the macro emits unconditional trait impls,
# so ts-rs must live in [dependencies] (not [dev-dependencies]) to keep release
# builds happy.  `no-serde-warnings` silences the helpful-but-noisy "you also
# need serde" hints; every derived type already carries Serialize/Deserialize.
ts-rs = { version = "12", features = ["no-serde-warnings"] }
# serde_json is used for compute_merged_rules_value and other heavy-payload exports.
# For very large inputs (tens of thousands of rules, ~30 MiB of data), passing a
# single UTF-8 string + serde_json::from_str is dramatically faster and safer than
# serde_wasm_bindgen's JsValue-by-JsValue deserialization path, which hammers the
# wasm externref table and can trigger "table index is out of bounds" traps on
# realistic workloads (e.g. 45k+ merged rules with 29 fields each).
serde_json = "1.0"
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
# talc 5.0.4+ fixes the gap/tag overlap for chunks >= 16 MiB that once forced a patched copy.
talc = { version = "5.1.1", default-features = false }
