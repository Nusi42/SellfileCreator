[package]
name = "rule_engine_wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
rule_engine_core = { path = "../rule_engine_core" }
serde = { version = "1.0", features = ["derive"] }
# serde_json is used for compute_merged_rules_value and other heavy-payload exports.
# For very large inputs (tens of thousands of rules, ~30 MiB of data), passing a
# single UTF-8 string + serde_json::from_str is dramatically faster and safer than
# serde_wasm_bindgen's JsValue-by-JsValue deserialization path, which hammers the
# wasm externref table and can trigger "table index is out of bounds" traps on
# realistic workloads (e.g. 45k+ merged rules with 29 fields each).
serde_json = "1.0"
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
# Replace dlmalloc (default WASM allocator) with talc, which coalesces free blocks
# aggressively and handles wasm32 memory.grow natively.  dlmalloc fragments badly
# under the mixed small/large allocation pattern produced by the improvement-chance
# phase followed by eval-collect, causing STATUS_ACCESS_VIOLATION on ~8 000-row
# artifact sets.  TalckWasm is purpose-built for wasm32-unknown-unknown.
# Features:
# - counters: minimal overhead (a few atomic increments per alloc/free); the data
#   is exposed via get_allocator_counters_value() when the dev-diagnostics feature
#   is active (WASM_DEV_DIAGNOSTICS=1 in the build script).
# - disable-grow-in-place / disable-realloc-in-place: force every reallocation
#   through alloc→copy→free. wasm-bindgen's passStringToWasm0 path for very
#   large UTF-8 payloads (27 MB+ JSON from compute_merged_rules_value on 45k-
#   rule workloads) issues malloc → realloc(grow) → realloc(shrink) in quick
#   succession. Any bug in talc's in-place realloc fast paths corrupts block
#   metadata, producing "memory access out of bounds" on a later deallocate
#   (e.g. inside prewarm_heap_value) — the symptom observed across multiple
#   pipeline runs once the heap has seen a handful of large string passes.
talc = { version = "5", default-features = false, features = ["counters", "disable-grow-in-place", "disable-realloc-in-place"] }

[features]
# Enable extra wasm_bindgen exports for dev-time heap diagnostics.
# Build with WASM_DEV_DIAGNOSTICS=1 to include get_allocator_counters_value().
dev-diagnostics = []
