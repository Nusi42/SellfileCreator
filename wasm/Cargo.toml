[workspace]
members = ["rule_engine_core", "rule_engine_wasm"]
exclude = ["rule_engine"]
resolver = "2"

# js-sys 0.3.91 triggers a const-eval panic in rustc 1.93 at opt-level=3.
# Capping its optimization to level 2 avoids the compiler bug while keeping
# our own crates fully optimized.
[profile.release.package.js-sys]
opt-level = 2
