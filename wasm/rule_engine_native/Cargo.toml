[package]
name    = "rule_engine_native"
version = "0.1.0"
edition = "2021"

[lib]
# cdylib produces a native shared library (.dll / .so / .dylib).
# No wasm-bindgen dependency — JSON strings are passed over the C ABI.
crate-type = ["cdylib"]

[dependencies]
rule_engine_core = { path = "../rule_engine_core" }
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
