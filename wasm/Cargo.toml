[workspace]
members = ["rule_engine_core", "rule_engine_wasm", "rule_engine_dsim_wasm", "sfc_engine"]
exclude = ["rule_engine"]
resolver = "2"

# Every crate in the workspace ships as part of the app, so they all carry the app's
# version rather than a private one Ã¢â‚¬â€ a consumer reading `sfc_version()` off a prebuilt
# DLL learns which app build produced it. This field is the ONE place the Rust side
# spells that version; members inherit it with `version.workspace = true`.
# It mirrors `version` in the repo-root package.json, which stays the single source of
# truth: the release script rewrites both together (see scripts/release/release-win.ps1),
# so never hand-edit this to a value package.json does not have.
[workspace.package]
version = "1.0.49-dev"

# TALC-PATCH: use the vendored copy of talc so we can apply our correctness patches.
# Fixes a talc 5.0.3 bug where the tag byte overlaps the end-size MSB, causing is_allocated()
# to misidentify free gaps Ã¢â€°Â¥16 MiB as allocated chunks, ultimately corrupting the free list.
#
# Root cause: upstream tag_byte(addr) = addr[-1] is the MSB of the 4-byte LE end-size word.
# For gaps in [16 MiB, 32 MiB) that MSB has ALLOCATED_FLAG set from the size value itself.
# deallocate misreads the gap as allocated, calls set_above_free on the end-size MSB (corrupts
# it), and clear_above_free (XOR) then flips ABOVE_FREE 0Ã¢â€ â€™1 Ã¢â€ â€™ next dealloc reads garbage Ã¢â€ â€™ OOB.
#
# Changes in vendor/talc vs upstream (grep TALC-PATCH):
#   - Architectural layout fix (chunk.rs): GAP_HIGH_SIZE_OFFSET 4Ã¢â€ â€™8, CHUNK_UNIT 16Ã¢â€ â€™32 (wasm32).
#     end-size word is now at end[-8..end-4]; tag byte stays at end[-1] but is now separate
#     padding Ã¢â‚¬â€ never the end-size MSB.  register_gap writes Tag(0) at end[-1] so is_allocated()
#     returns false for ANY gap size.  set_above_free can no longer corrupt end-size.
#     This makes the is_allocated()/ABOVE_FREE corruption chain ARCHITECTURALLY IMPOSSIBLE.
#   - clear_above_free: AND-NOT instead of XOR (tag.rs) Ã¢â‚¬â€ idempotent spurious clears are safe
#   - talc_gap_looks_valid(): simplified size cross-check (mod.rs) Ã¢â‚¬â€ CHUNK_UNIT trivial-match
#     exception and Node structural check no longer needed; size fields at distinct addresses
#   - Non-panicking set_above_free / clear_above_free: removed debug_assert (tag.rs) to prevent
#     recursive-panic when the panic handler itself allocates
[patch.crates-io]
talc = { path = "vendor/talc" }
