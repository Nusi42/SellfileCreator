[workspace]
members = ["rule_engine_core", "rule_engine_wasm", "rule_engine_dsim_wasm", "rule_engine_native"]
exclude = ["rule_engine"]
resolver = "2"

# rustc 1.93 introduced a const-eval regression (E0080 "scalar size mismatch")
# that fires when wasm-bindgen's flat_byte_slices is inlined into js-sys const
# initialisers during a wasm32 release build at opt-level=3.  Capping both
# packages to opt-level=2 avoids the inlining path that triggers the bug while
# keeping our own crates fully optimised.
[profile.release.package.js-sys]
opt-level = 2
[profile.release.package.wasm-bindgen]
opt-level = 2

# TALC-PATCH: use the vendored copy of talc so we can apply our correctness patches.
# Fixes a talc 5.0.3 bug where the ABOVE_FREE flag can become stale, causing deallocate to
# read garbage user-data as a gap size and trap with OOB.
#
# Root cause: tag_byte(addr) = addr[-1] is the MSB of the 4-byte LE end-size word for any free
# gap ending at `addr`.  For gaps in [16 MiB, 32 MiB) that MSB has bit 0 (ALLOCATED_FLAG) set
# from the size value, so is_allocated() returns true on a FREE gap.  deallocate skips the
# below-coalesce and calls set_above_free on the gap's end-size MSB, corrupting it.
# Subsequent clear_above_free (original XOR) flips ABOVE_FREE 0→1 creating a false-positive
# that causes the next deallocate to follow a garbage gap pointer → OOB trap.
#
# Changes in vendor/talc vs upstream (grep TALC-PATCH):
#   - clear_above_free: AND-NOT instead of XOR (root fix — spurious clears are idempotent)
#   - talc_gap_looks_valid(): strengthened cross-check in deallocate / try_grow_in_place /
#     shrink — adds Node.next_of_prev structural invariant + skips trivially self-matching
#     size check for CHUNK_UNIT-sized gaps (where base-size and end-size fields overlap)
#   - ABOVE_FREE preservation when writing the allocation tag (try_allocate / try_grow_in_place)
#   - Non-panicking set_above_free / clear_above_free (removed debug_assert to prevent
#     recursive-panic when the panic handler itself allocates)
[patch.crates-io]
talc = { path = "vendor/talc" }
